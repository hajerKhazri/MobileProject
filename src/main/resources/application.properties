server.port=8085

spring.application.name=enda_tao

spring.datasource.url=jdbc:mysql://localhost:3306/enda_tao?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.main.allow-bean-definition-overriding=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#######################################################
# OAUTH2 CLIENT (LOGIN VIA KEYCLOAK)
#######################################################

spring.security.oauth2.client.registration.keycloak.client-id=enda_tao_client
spring.security.oauth2.client.registration.keycloak.client-secret=TON_CLIENT_SECRET
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8088/realms/enda_tao_realm

# Resource server (validation des JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8088/realms/enda_tao_realm

# Keycloak client secret (remplacez par la valeur réelle)
keycloak.client-secret=YgGIyAJ2dFvchRcNXbGvFIGiv9KKi2sE

# URL de base de Keycloak.
# En local : http://localhost:8088
# En Docker : http://keycloak-service:8080 (ou le port interne du conteneur)
keycloak.base-url=http://localhost:8088

#######################################################
# SESSION COOKIE
#######################################################

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# CORS (renfort)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600
server.address=0.0.0.0
